<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>학습 양식 · 회복탄력성 진단 | Growth Edu Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --forest:#24382F; --paper:#EFEAD8; --cream:#F6F2E4; --sun:#E8A936; --ink:#1B2620; --muted:#5C6B64; --line:#DAD3BC; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }
  body{ font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--paper); color:var(--ink); line-height:1.65; -webkit-font-smoothing:antialiased; }
  .wrap{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .top{ background:var(--forest); color:var(--paper); padding:16px 24px; font-family:'Gowun Batang',serif; font-weight:700; font-size:1.05rem; }
  .top span{ color:var(--sun); margin-left:2px; }
  .stage{ flex:1; display:grid; place-items:center; padding:32px 20px; }
  .card{ width:min(460px,100%); background:#fff; border:1px solid var(--line); border-radius:20px; padding:40px 30px 30px; text-align:center; box-shadow:0 18px 50px rgba(36,56,47,.10); }
  .icon{ width:60px; height:60px; margin:0 auto 18px; border-radius:50%; background:var(--cream); color:var(--forest); display:grid; place-items:center; }
  .icon svg{ width:28px; height:28px; }
  .spin{ animation:turn 1s linear infinite; }
  @keyframes turn{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spin{ animation-duration:2.4s; } }
  h1{ font-family:'Gowun Batang',serif; font-size:1.45rem; line-height:1.4; margin-bottom:10px; letter-spacing:-.02em; }
  #desc{ color:var(--muted); font-size:.95rem; word-break:keep-all; }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:26px; }
  .actions:empty{ display:none; }
  .btn{ display:flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:12px; border:1px solid transparent; font:inherit; font-weight:700; font-size:.95rem; cursor:pointer; text-decoration:none; }
  .btn-main{ background:var(--forest); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--forest); border-color:var(--line); }
  .btn-kakao{ background:#FEE500; color:#191919; }
  :focus-visible{ outline:3px solid var(--sun); outline-offset:3px; }
  .maker{ margin-top:26px; padding-top:18px; border-top:1px dashed var(--line); }
  .linkish{ background:none; border:none; font:inherit; font-size:.78rem; color:#8a948e; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:6px; }
  #codeForm{ display:flex; gap:8px; margin-top:12px; }
  #codeForm[hidden]{ display:none; }
  #code{ flex:1; min-width:0; min-height:46px; padding:0 14px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:.95rem; letter-spacing:.04em; background:#fff; }
  #codeForm .btn{ min-height:46px; padding:0 18px; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">Growth Edu Lab<span>학습연구소</span></div>
  <div class="stage">
    <div class="card" id="card" role="status" aria-live="polite" aria-busy="true">
      <div class="icon is-loading" id="icon"></div>
      <h1 id="title">링크를 확인하고 있어요</h1>
      <p id="desc">잠시만 기다려 주세요.</p>
      <div class="actions" id="actions"></div>
      <div class="maker">
        <button type="button" class="linkish" id="openCode">제작자 확인용</button>
        <form id="codeForm" hidden autocomplete="off">
          <label for="code" class="sr">오픈코드</label>
          <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="오픈코드 입력">
          <button class="btn btn-main" type="submit">열기</button>
        </form>
      </div>
    </div>
  </div>
</div>

      desc: '코드를 다시 확인해 주세요. 영문은 대소문자를 구분하지 않아요.',
      actions: ['home']
    }
  };

  var lastState = 'loading';
  var pendingRetry = null;

  function show(name, extra) {
    lastState = name;
    var st = STATES[name];
    $('icon').innerHTML = ICONS[st.icon];
    $('icon').className = 'icon ' + (name === 'loading' ? 'is-loading' : '');
    $('title').textContent = st.title;
    $('desc').textContent = (extra && extra.desc) || st.desc;
    var box = $('actions');
    box.innerHTML = '';
    (st.actions || []).forEach(function (a) {
      var node;
      if (a === 'home') {
        node = document.createElement('a'); node.href = '../index.html'; node.textContent = '홈페이지로'; node.className = 'btn btn-ghost';
      } else if (a === 'channel') {
        if (!C.KAKAO_CHANNEL_URL) return;
        node = document.createElement('a'); node.href = C.KAKAO_CHANNEL_URL; node.textContent = '카카오톡 채널로 문의'; node.className = 'btn btn-kakao';
        node.target = '_blank'; node.rel = 'noopener';
      } else if (a === 'retry') {
        node = document.createElement('button'); node.type = 'button'; node.textContent = '다시 시도'; node.className = 'btn btn-main';
        node.addEventListener('click', function () { if (pendingRetry) pendingRetry(); else location.reload(); });
      }
      if (node) box.appendChild(node);
    });
    $('card').setAttribute('aria-busy', name === 'loading' ? 'true' : 'false');
  }

  // ───── 유틸 ─────
  function b64d(s) {
    var bin = atob(s), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function isKakao() { return /KAKAOTALK/i.test(navigator.userAgent || ''); }
  function parseHash() {
    var out = {};
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return out;
    h.split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }
  function store(kind, op, key, val) {
    try {
      var s = window[kind];
      if (op === 'get') return s.getItem(key);
      if (op === 'set') { s.setItem(key, val); return true; }
      if (op === 'del') { s.removeItem(key); return true; }
    } catch (e) { /* 저장소 차단 환경 */ }
    return op === 'get' ? null : false;
  }

  // ───── 복호화 + 페이지 교체 ─────
  function openPage(keyBytes, ctx) {
    return crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64d(S.iv), additionalData: enc.encode('gel:' + S.id) },
        key, b64d(S.ct)
      );
    }).then(function (buf) {
      var html = dec.decode(buf);
      var boot = {
        id: S.id,
        token: ctx.token || '',
        preview: !!ctx.preview,
        gas: C.GAS_URL || '',
        channel: C.KAKAO_CHANNEL_URL || '',
        restore: ctx.restore || '',
        kakao: isKakao(),
        home: '../index.html'
      };
      var inject = '<script>window.GEL=' + JSON.stringify(boot).replace(/</g, '\\u003c') + ';<\/script>';
      var at = html.indexOf('<head>');
      html = at >= 0 ? html.slice(0, at + 6) + inject + html.slice(at + 6) : inject + html;

      // 주소창에서 토큰·오픈코드를 지운다 (공유 버튼으로 링크가 새어나가는 것 방지)
      try {
        var keep = ctx.restore ? '#r=' + ctx.restore : '';
        if (ctx.token && !store('sessionStorage', 'set', 'gel_t_' + S.id, ctx.token)) keep = null;
        if (keep !== null) history.replaceState(null, '', location.pathname + keep);
      } catch (e) { /* 무시 */ }

      document.open();
      document.write(html);
      document.close();
    });
  }

  // ───── 1) 개인 링크(토큰) ─────
  function withToken(token, restore) {
    if (!C.GAS_URL) { show('config'); return; }
    if (C.REQUIRE_KAKAO_APP && !isKakao()) { show('kakao'); return; }
    pendingRetry = function () { withToken(token, restore); };
    show('loading');
    var url = C.GAS_URL + (C.GAS_URL.indexOf('?') > -1 ? '&' : '?') +
      'action=access&survey=' + encodeURIComponent(S.id) + '&token=' + encodeURIComponent(token) +
      (restore ? '&mode=report' : '');
    fetch(url, { method: 'GET', redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.valid && d.key) {
        return openPage(b64d(d.key), { token: token, restore: restore }).catch(function () { show('decrypt'); });
      }
      var reason = d && d.reason;
      if (reason === 'expired') show('expired');
      else if (reason === 'wrong-survey') show('wrong');
      else if (reason === 'limit') show('limit');
      else if (reason === 'busy' || reason === 'error') show('error');
      else show('locked', { desc: '유효하지 않은 링크예요. 카카오톡(문자)으로 받은 링크를 그대로 눌러 주세요.' });
    }).catch(function () { show('error'); });
  }

  // ───── 2) 오픈코드 ─────
  function withCode(code, restore) {
    if (!KEYS || !KEYS.items || !KEYS.items[S.id]) { show('badcode', { desc: '오픈코드 정보(keys.js)를 불러오지 못했어요.' }); return; }
    pendingRetry = null;
    show('loading');
    var normalized = String(code).normalize('NFKC').toUpperCase().replace(/[\s\-\u2010-\u2015_]+/g, '');
    crypto.subtle.importKey('raw', enc.encode(normalized), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64d(KEYS.salt), iterations: KEYS.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
    }).then(function (W) {
      var w = KEYS.items[S.id];
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(w.iv), additionalData: enc.encode('gel:wrap:' + S.id) }, W, b64d(w.ct));
    }).then(function (rawKey) {
      return openPage(new Uint8Array(rawKey), { preview: true, restore: restore }).catch(function () { show('decrypt'); });
    }, function () { show('badcode'); });
  }

  // ───── 시작 ─────
  function boot() {
    if (!window.crypto || !crypto.subtle) { show('nocrypto'); return; }
    var hash = parseHash();
    var q = new URLSearchParams(location.search);
    var token = q.get('token') || store('sessionStorage', 'get', 'gel_t_' + S.id) || '';

    $('codeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = $('code').value;
      if (v && v.trim()) withCode(v, hash.r || '');
    });
    $('openCode').addEventListener('click', function () {
      var f = $('codeForm'); f.hidden = !f.hidden;
      if (!f.hidden) $('code').focus();
    });

    if (hash.open) { withCode(hash.open, hash.r || ''); return; }
    if (token) { withToken(token, hash.r || ''); return; }
    show(C.REQUIRE_KAKAO_APP && !isKakao() ? 'kakao' : 'locked');
  }

  boot();
})();

</script>
</body>
</html>
